<!DOCTYPE html>
<html>

<head>
    <title>My First Game - You Shall Not Pass Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>You Shall Not Pass Games</h1>
    </header>

    <main>

<div class="game-area">

    <p>Score: <span id="score">0</span></p>

    <p>Time: <span id="timer">30</span></p>

    <button onclick="addPoint()">CLICK!</button>

    <div id="game-over">
    <h2>GAME OVER!</h2>
    <p>Final Score: <span id="final-score">0</span></p>
    <button onclick="restartGame()">PLAY AGAIN</button>
</div>
</div>

        <a href="index.html">← Back to Games</a>

    </main>

    <script src="script.html"></script>

</body>

</html>
